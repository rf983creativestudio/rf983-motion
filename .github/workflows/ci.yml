name: RF983 MOTION checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
      - run: PYTHONPATH=.. python -m pytest ../worker/test_engine_contract.py
      - run: python -m compileall -q ../worker
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
      - run: test -s frontend/index.html && test -s frontend/style.css && test -s frontend/app.js

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public deployment image
        run: docker build -t rf983-motion:ci .
      - name: Verify deployment manifest files
        run: test -s render.yaml && test -s deploy/start.sh && test -s deploy/nginx.conf.template && test -s docs/DEPLOYMENT_0.9.0.md
