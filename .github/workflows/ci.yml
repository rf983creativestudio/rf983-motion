name: RF983 MOTION checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rf983_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rf983_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RF983_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/rf983_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
      - run: PYTHONPATH=.. python -m pytest tests/test_job_store.py ../worker/test_engine_contract.py ../worker/test_wan22_engine.py ../worker/test_cloud_worker.py ../worker/test_wan22_adapter.py ../worker/test_gpu_readiness.py
      - run: python -m compileall -q ../worker
  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
      - run: test -s frontend/index.html && test -s frontend/style.css && test -s frontend/app.js
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build public deployment image
        run: docker build -t rf983-motion:ci .
      - name: Build cloud worker runtime image
        run: docker build -f Dockerfile.worker -t rf983-motion-worker:ci .
      - name: Verify deployment manifest files
        run: test -s render.yaml && test -s deploy/start.sh && test -s deploy/nginx.conf.template && test -s docs/DEPLOYMENT_0.9.0.md && test -s docs/CLOUD_GPU_WORKER_2.1.0.md && test -s docs/GPU_DEPLOYMENT_READINESS_2.3.0.md && test -s docs/FINAL_RELEASE_2.4.0.md